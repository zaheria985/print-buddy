# Docker defaults for Print Buddy. Override with PRINT_BUDDY__SECTION__KEY.
# Legacy config/docker.toml remains supported when explicitly selected.
orca:
  # Source-installed binary; requires WITH_ORCA=true at image build time
  command:
    - /usr/bin/orca-slicer
bambu:
  # Source-installed binary; requires WITH_BAMBU=true at image build time.
  # The default slicer for Bambu Lab printers; elsewhere only Orca's one-shot fallback.
  command:
    - /usr/bin/bambu-studio
paths:
  hermes_home: /data/hermes
  archive: /data/archive
  records_vault: /data/records
  cache: /data/cache
  hermes_bin: /usr/local/bin/hermes
  ffmpeg: ffmpeg
  hermes_agent: /data/hermes/hermes-agent
  hermes_restart_helper: /data/hermes/restart_hermes.py
services:
  # Set via environment or mount a selected override file
  moonraker_url: ""
  moonraker_ws_url: ""
  camera_snapshot_url: ""
  spoolman_url: ""
  openviking_url: ""
  vision_chat_url: ""
  stock_api_port: 8898
printer:
  # Override with PRINT_BUDDY__PRINTER__MODEL=sovol.sv06 etc.
  model: flashforge.ad5x
