# Installation example only. No published release image exists yet.
# Set PRINT_BUDDY_IMAGE to an approved locally built image or future immutable digest.
x-runtime: &runtime
  image: ${PRINT_BUDDY_IMAGE:?Set PRINT_BUDDY_IMAGE to a tested image digest or local tag}
  restart: unless-stopped
  env_file: [.env]
  environment:
    # To use legacy TOML, select /app/config/docker.toml in .env.
    # Mount a custom config at the selected path with a local Compose override.
    PRINT_BUDDY_CONFIG: ${PRINT_BUDDY_CONFIG:-/app/config/docker.yaml}
    PRINT_BUDDY__BOT__MODE: standalone
  volumes:
    - ${PRINT_BUDDY_DATA:-./data}/hermes:/data/hermes
    - ${PRINT_BUDDY_DATA:-./data}/archive:/data/archive
    - ${PRINT_BUDDY_DATA:-./data}/records:/data/records
    - ${PRINT_BUDDY_DATA:-./data}/cache:/data/cache
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
  shm_size: 256m
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  bot:
    <<: *runtime
    command: [python3, -m, print_buddy.bot]
    healthcheck:
      test: [CMD, python3, -m, print_buddy.bot, health]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  listener:
    <<: *runtime
    command: [python3, -m, print_buddy.hermes.moonraker_event_listener]
    healthcheck:
      test: [CMD, python3, -m, print_buddy.healthcheck]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
