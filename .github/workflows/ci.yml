name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  offline-tests:
    runs-on: ubuntu-24.04  # Debian 13 container; hosted runner supplies the VM only.
    container:
      image: python:${{ matrix.python-version }}-slim-trixie
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      # Tests inspect tracked files and ignore rules, so checkout needs real Git metadata.
      - name: Install Git before checkout
        run: |
          command -v git || { apt-get update -q && apt-get install -y -q git; }
          git --version
      - uses: actions/checkout@v7
      - name: Normalize checkout ownership for Git subprocesses
        # checkout's safe.directory lives in its temporary HOME, not the test process HOME.
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
      - run: python -m pip install -r requirements-test.txt
      - name: Offline tests (no printer, no slicer, no network)
        timeout-minutes: 25
        run: python -m pytest -q tests

  discord-timing:
    # Fake Discord flow timing on both transports, mock slicer, 3 repeats; medians must stay within
    # tests/corpus/timing_baseline.json (+tolerance +slack). Raising a baseline needs a "reason".
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Time the corpus (3 repeats, both transports)
        run: |
          mkdir -p timing
          for i in 1 2 3; do python -m tests.corpus.time_corpus --transport both --json timing/run-$i.json; done
      - name: Timing gate against the reviewed baseline
        run: python -m tests.corpus.timing_gate timing/run-1.json timing/run-2.json timing/run-3.json
      - name: Proposed baseline from this runner (for review, never applied automatically)
        if: always()
        run: python -m tests.corpus.timing_gate timing/run-*.json --record > timing/proposed-baseline.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discord-timing
          path: timing/

  standalone-no-hermes:
    # #73: the standalone bot installs from requirements.txt alone, loads every handler and imports no Hermes module.
    runs-on: ubuntu-24.04  # Debian 13 container; hosted runner supplies the VM only.
    container:
      image: python:3.12-slim-trixie
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Clean venv with runtime requirements only
        run: |
          python -m venv "/tmp/clean"
          "/tmp/clean/bin/python" -m pip install -r requirements.txt
      - name: Standalone bot setup check
        env:
          PRINT_BUDDY__BOT__MODE: standalone
          PRINT_BUDDY__DISCORD__CHAT_ID: "100000000000000001"
          PRINT_BUDDY__DISCORD__ALLOWED_USER_IDS: "200000000000000002"
          DISCORD_BOT_TOKEN: not-a-real-token
        run: |
          export PRINT_BUDDY__PATHS__HERMES_HOME="/tmp/print-buddy"
          "/tmp/clean/bin/python" -m print_buddy.bot check

  light-install-arm64:
    # The Raspberry Pi route: runtime requirements install on arm64 and the installer plus wizard run end to end (dry run).
    runs-on: ubuntu-24.04-arm  # Debian 13 container on the hosted arm64 runner (Raspberry Pi OS is Debian based).
    container:
      image: python:3.12-slim-trixie
    timeout-minutes: 15
    steps:
      # Git must exist before checkout or the action falls back to an archive without .git.
      - name: Debian tools the installer expects
        run: |
          apt-get update -q && apt-get install -y -q git curl ca-certificates sudo
      - uses: actions/checkout@v7
      - name: Prepare normal installer user
        # install-light refuses root, so add a normal sudo user like a Pi owner.
        run: |
          useradd -m -s /bin/bash pi
          echo 'pi ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/pi
          chown -R pi "$GITHUB_WORKSPACE" && chmod 1777 "$RUNNER_TEMP"
          runuser -u pi -- git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree
      - name: Runtime requirements on arm64
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Installer and wizard dry run with an answers file
        shell: runuser -u pi -- bash -e {0}
        run: |
          cat > "$RUNNER_TEMP/answers.yaml" <<'YAML'
          brand: sovol
          model: sovol.sv06
          has_printer_software: "yes"
          moonraker_url: http://printer.local:7125
          spoolman: install
          camera: "yes"
          have_bot: "no"
          discord_chat_id: "100000000000000001"
          discord_user_ids: "200000000000000002"
          hermes: "no"
          YAML
          bash scripts/install-light.sh --dry-run --yes --dir "$GITHUB_WORKSPACE" --ref "$GITHUB_SHA" --answers "$RUNNER_TEMP/answers.yaml" | tee "$RUNNER_TEMP/out.txt"
          grep -q 'com.orcaslicer.OrcaSlicer' "$RUNNER_TEMP/out.txt"
          grep -q 'Dry run: nothing was changed' "$RUNNER_TEMP/out.txt"
          test ! -e config/local.yaml

  real-slicer:
    # Full corpus and slicer fixtures stay on the production-default OrcaSlicer 2.4.2 track.
    # Flatpak plus xvfb requires a full system session and display; kept on the host runner after
    # Debian 13 container attempts failed during actual slicer startup.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install Flathub OrcaSlicer 2.4.2 and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub com.orcaslicer.OrcaSlicer
          flatpak info --user com.orcaslicer.OrcaSlicer
      - name: Run real-slicer tests (2.4.2)
        env:
          PRINT_BUDDY_REAL_SLICER: "1"
        run: xvfb-run -a python -m pytest -v -s tests/slicer
      - name: Discord flow corpus with real Orca
        env:
          PRINT_BUDDY_REAL_SLICER: "1"
        run: xvfb-run -a python -m pytest -v -s tests/corpus

  real-slicer-bambu-studio:
    # [printer] slicer: bambu_studio, the Bambu Lab default. The A1 profiles still come from the installed
    # OrcaSlicer (profiles.py), so both Flathub apps are installed; only the Bambu Studio cases run here.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install Flathub Bambu Studio, OrcaSlicer 2.4.2 and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub com.orcaslicer.OrcaSlicer com.bambulab.BambuStudio
          flatpak info --user com.orcaslicer.OrcaSlicer
          flatpak info --user com.bambulab.BambuStudio
      - name: Run the A1 production flow with Bambu Studio
        env:
          PRINT_BUDDY_REAL_SLICER: "1"
          PB_REQUIRE_BAMBU_STUDIO: "1"
        run: xvfb-run -a python -m pytest -v -s -k bambu_studio tests/slicer/test_orca_real_bambu_a1.py

  real-slicer-alpha:
    # Alpha validation is intentionally limited; full Discord corpus remains on the 2.4.2 job.
    # Flatpak plus xvfb requires a full system session and display; kept on the host runner after
    # Debian 13 container attempts failed during actual slicer startup.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORCA_FLATPAK_APP_ID: com.orcaslicer.OrcaSlicer
      PRINT_BUDDY_REAL_SLICER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install flatpak and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
      - name: Cache OrcaSlicer 2.5.0 alpha bundle and runtime
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/orcaslicer-v2.5.0-alpha.flatpak
            ~/.local/share/flatpak
          key: orcaslicer-flatpak-v2.5.0-alpha-${{ runner.os }}-x86_64
      - name: Download and verify upstream OrcaSlicer v2.5.0-alpha bundle
        run: |
          set -euo pipefail
          bundle="$HOME/.cache/orcaslicer-v2.5.0-alpha.flatpak"
          mkdir -p "$(dirname "$bundle")"
          if [ -f "$bundle" ] && ! echo '2caa907e75ca1cd499568d7940d1fe787b795b3deff1d5dcf4cda31f1a4b6d32  '"$bundle" | sha256sum --check --status; then
            rm "$bundle"
          fi
          if [ ! -f "$bundle" ]; then
            curl --fail --location --retry 3 --output "$bundle" \
              https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.0-alpha/OrcaSlicer-Linux-flatpak_V2.5.0-alpha_x86_64.flatpak
          fi
          echo '2caa907e75ca1cd499568d7940d1fe787b795b3deff1d5dcf4cda31f1a4b6d32  '"$bundle" | sha256sum --check
          echo "ORCA_ALPHA_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Install OrcaSlicer app bundle and runtime
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//50
          # The restored cache may already contain the app; do not reinstall its bundle.
          if ! flatpak info --user --show-ref "$ORCA_FLATPAK_APP_ID" >/dev/null 2>&1; then
            flatpak install --user --bundle -y --noninteractive "$ORCA_ALPHA_BUNDLE"
          fi
          flatpak info --user --show-ref "$ORCA_FLATPAK_APP_ID"
          flatpak info --user --show-commit "$ORCA_FLATPAK_APP_ID"
      - name: Run slicer tests (2.5.0 alpha)
        run: xvfb-run -a python -m pytest -v -s tests/slicer
      - name: Run representative Discord fixtures (2.5.0 alpha only)
        run: >-
          xvfb-run -a python -m pytest -v -s
          tests/corpus/test_corpus.py::test_discord_flow[single-part]
          tests/corpus/test_corpus.py::test_discord_flow[plates-multicolor]

  spoolman:
    # spool_sync against a real, throwaway Spoolman.
    runs-on: ubuntu-24.04  # Debian 13 container; hosted runner supplies the VM only.
    container:
      image: python:3.12-slim-trixie
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install -r requirements-test.txt
      - name: Install Debian tools and pinned Spoolman server
        run: |
          set -euo pipefail
          apt-get update -q
          apt-get install -y -q curl unzip
          archive="$RUNNER_TEMP/spoolman.zip"
          curl -fL --retry 3 https://github.com/Donkie/Spoolman/releases/download/v0.27.0/spoolman.zip -o "$archive"
          echo 'bcc961af4c20d7ad7f1740f5609cd3efd94c4556baafaeba5036122dd7e46704  '"$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/spoolman-src"
          unzip -q "$archive" -d "$RUNNER_TEMP/spoolman-src"
          cd "$RUNNER_TEMP/spoolman-src"
          python -m venv "$RUNNER_TEMP/spoolman-venv"
          "$RUNNER_TEMP/spoolman-venv/bin/python" -m pip install uvicorn~=0.34
          "$RUNNER_TEMP/spoolman-venv/bin/python" -m pip install -r requirements.txt
          echo "SPOOLMAN_APP_DIR=$PWD" >> "$GITHUB_ENV"
          echo "SPOOLMAN_PYTHON=$RUNNER_TEMP/spoolman-venv/bin/python" >> "$GITHUB_ENV"
      - name: Start isolated Spoolman server
        run: |
          mkdir -p "$RUNNER_TEMP/spoolman-data"
          cd "$SPOOLMAN_APP_DIR"
          PATH="$RUNNER_TEMP/spoolman-venv/bin:$PATH" SPOOLMAN_DIR_DATA="$RUNNER_TEMP/spoolman-data" SPOOLMAN_PORT=7912 SPOOLMAN_HOST=127.0.0.1 \
            "$SPOOLMAN_PYTHON" -m uvicorn spoolman.main:app --host 127.0.0.1 --port 7912 \
            > "$RUNNER_TEMP/spoolman.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/spoolman.pid"
      - name: Wait for Spoolman
        run: |
          for i in $(seq 60); do
            if curl -fsS -o /dev/null http://localhost:7912/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/spoolman.log"
          echo "Spoolman did not come up"; exit 1
      - name: Spoolman tests
        env:
          PRINT_BUDDY_SPOOLMAN_TEST_URL: http://localhost:7912
        run: python -m pytest -v -rs tests/services
